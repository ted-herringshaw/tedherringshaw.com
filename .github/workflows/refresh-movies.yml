name: Refresh movie data

# Streaming availability drifts constantly — titles leave Netflix, arrive on
# Max — so the prebuilt catalog at public/movies/movies.json needs a periodic
# rebuild. Committing the result is what triggers the normal Vercel deploy;
# there's no separate deploy step here.

on:
  schedule:
    # Mondays at 11:00 UTC (early morning US), before anyone plans movie night.
    - cron: "0 11 * * 1"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Needed for the commit below, since GITHUB_TOKEN is read-only by default.
permissions:
  contents: write

# Never let two refreshes race each other into a push conflict.
concurrency:
  group: refresh-movies
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The generator has no dependencies beyond Node's built-ins, so there's
      # nothing to install — skipping npm ci keeps this job a few seconds long.
      - name: Rebuild movies.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run refresh-movies

      # Most weeks only a handful of providerMask values change; some weeks
      # nothing does, and then this exits without a commit so Vercel stays idle.
      # The generator aborts on its own if too few movies resolved, so a bad
      # run fails the job above rather than committing a truncated catalog.
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/movies/movies.json; then
            echo "No changes to movies.json — nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/movies/movies.json
          git commit -m "Refresh movie data from TMDB"
          git push
